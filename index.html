<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Würfelspiel</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-active: #334155;
      --accent: #f59e0b;
      --accent-2: #38bdf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --win: #22c55e;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 2rem;
      letter-spacing: 0.5px;
    }

    .subtitle {
      color: var(--muted);
      margin: 0 0 24px;
      text-align: center;
      max-width: 460px;
    }

    .board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
      max-width: 520px;
      margin-bottom: 24px;
    }

    .player {
      background: var(--panel);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      border: 2px solid transparent;
      transition: border-color 0.3s, background 0.3s;
    }

    .player.active {
      border-color: var(--accent);
      background: var(--panel-active);
    }

    .player h2 {
      margin: 0 0 8px;
      font-size: 1.1rem;
    }

    .score {
      font-size: 2.6rem;
      font-weight: 700;
    }

    .round-label {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 10px;
    }

    .round-score {
      font-size: 1.4rem;
      color: var(--accent-2);
      font-weight: 600;
    }

    .dice-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .dice {
      width: 100px;
      height: 100px;
      background: #f8fafc;
      border-radius: 18px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .dice.rolling { animation: shake 0.5s ease; }

    @keyframes shake {
      0%, 100% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-12deg) scale(1.08); }
      50% { transform: rotate(10deg) scale(0.95); }
      75% { transform: rotate(-6deg) scale(1.05); }
    }

    .pip {
      width: 16px;
      height: 16px;
      background: #0f172a;
      border-radius: 50%;
      align-self: center;
      justify-self: center;
    }

    .pip.hidden { visibility: hidden; }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      font: inherit;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      padding: 12px 22px;
      cursor: pointer;
      color: #0f172a;
      transition: transform 0.1s, opacity 0.2s;
    }

    button:active { transform: translateY(2px); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-roll { background: var(--accent); }
    .btn-hold { background: var(--accent-2); }
    .btn-new { background: #e2e8f0; }

    .message {
      margin-top: 20px;
      min-height: 28px;
      font-size: 1.1rem;
      text-align: center;
      font-weight: 600;
    }

    .message.win { color: var(--win); }
    .message.bust { color: var(--danger); }

    footer {
      margin-top: 28px;
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <h1>🎲 Würfelspiel</h1>
  <p class="subtitle">
    Würfle und sammle Punkte. Mit <strong>Halten</strong> sicherst du deine
    Rundenpunkte. Würfelst du eine <strong>1</strong>, verfällt die Runde.
    Wer zuerst <strong>50</strong> Punkte erreicht, gewinnt!
  </p>

  <div class="board">
    <div class="player active" id="player-0">
      <h2>Du</h2>
      <div class="score" id="score-0">0</div>
      <div class="round-label">Diese Runde</div>
      <div class="round-score" id="round-0">0</div>
    </div>
    <div class="player" id="player-1">
      <h2>Computer</h2>
      <div class="score" id="score-1">0</div>
      <div class="round-label">Diese Runde</div>
      <div class="round-score" id="round-1">0</div>
    </div>
  </div>

  <div class="dice-area">
    <div class="dice" id="dice" aria-label="Würfel">
      <!-- Pips werden per JS gesetzt -->
    </div>
    <div class="controls">
      <button class="btn-roll" id="btn-roll">Würfeln</button>
      <button class="btn-hold" id="btn-hold">Halten</button>
      <button class="btn-new" id="btn-new">Neues Spiel</button>
    </div>
  </div>

  <div class="message" id="message"></div>

  <footer>Erreiche als Erster 50 Punkte.</footer>

  <script>
    const WINNING_SCORE = 50;

    const pipLayouts = {
      1: [4],
      2: [0, 8],
      3: [0, 4, 8],
      4: [0, 2, 6, 8],
      5: [0, 2, 4, 6, 8],
      6: [0, 2, 3, 5, 6, 8],
    };

    const diceEl = document.getElementById("dice");
    const messageEl = document.getElementById("message");
    const btnRoll = document.getElementById("btn-roll");
    const btnHold = document.getElementById("btn-hold");
    const btnNew = document.getElementById("btn-new");

    let scores, roundScore, activePlayer, playing;

    function renderDice(value) {
      diceEl.innerHTML = "";
      const active = new Set(pipLayouts[value]);
      for (let i = 0; i < 9; i++) {
        const pip = document.createElement("span");
        pip.className = "pip" + (active.has(i) ? "" : " hidden");
        diceEl.appendChild(pip);
      }
    }

    function setMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = "message" + (type ? " " + type : "");
    }

    function updateUI() {
      document.getElementById("score-0").textContent = scores[0];
      document.getElementById("score-1").textContent = scores[1];
      document.getElementById("round-0").textContent =
        activePlayer === 0 ? roundScore : 0;
      document.getElementById("round-1").textContent =
        activePlayer === 1 ? roundScore : 0;

      document.getElementById("player-0").classList.toggle("active", activePlayer === 0);
      document.getElementById("player-1").classList.toggle("active", activePlayer === 1);
    }

    function setControlsEnabled(enabled) {
      btnRoll.disabled = !enabled;
      btnHold.disabled = !enabled;
    }

    function initGame() {
      scores = [0, 0];
      roundScore = 0;
      activePlayer = 0;
      playing = true;
      renderDice(1);
      setMessage("");
      setControlsEnabled(true);
      updateUI();
    }

    function switchPlayer() {
      roundScore = 0;
      activePlayer = activePlayer === 0 ? 1 : 0;
      updateUI();
    }

    function endGame(winner) {
      playing = false;
      setControlsEnabled(false);
      setMessage(
        winner === 0 ? "🎉 Du hast gewonnen!" : "🤖 Der Computer gewinnt!",
        "win"
      );
    }

    function rollDice() {
      return new Promise((resolve) => {
        const value = Math.floor(Math.random() * 6) + 1;
        diceEl.classList.add("rolling");
        setTimeout(() => {
          renderDice(value);
          diceEl.classList.remove("rolling");
          resolve(value);
        }, 500);
      });
    }

    async function handleRoll() {
      if (!playing) return;
      setControlsEnabled(false);
      const value = await rollDice();

      if (value === 1) {
        setMessage("💥 Eine 1! Rundenpunkte verfallen.", "bust");
        switchPlayer();
        if (activePlayer === 1) {
          setTimeout(computerTurn, 900);
        } else {
          setControlsEnabled(true);
        }
      } else {
        roundScore += value;
        setMessage("");
        updateUI();
        setControlsEnabled(true);
      }
    }

    function handleHold() {
      if (!playing) return;
      scores[activePlayer] += roundScore;
      if (scores[activePlayer] >= WINNING_SCORE) {
        updateUI();
        endGame(activePlayer);
        return;
      }
      switchPlayer();
      if (activePlayer === 1) {
        setControlsEnabled(false);
        setTimeout(computerTurn, 900);
      }
    }

    async function computerTurn() {
      if (!playing) return;
      setControlsEnabled(false);

      while (playing && activePlayer === 1) {
        const value = await rollDice();

        if (value === 1) {
          setMessage("💥 Computer würfelt eine 1!", "bust");
          switchPlayer();
          setControlsEnabled(true);
          break;
        }

        roundScore += value;
        updateUI();

        const projected = scores[1] + roundScore;
        // Strategie: halten ab 20 Rundenpunkten oder wenn Sieg erreichbar.
        if (projected >= WINNING_SCORE || roundScore >= 20) {
          scores[1] += roundScore;
          if (scores[1] >= WINNING_SCORE) {
            updateUI();
            endGame(1);
            return;
          }
          switchPlayer();
          setControlsEnabled(true);
          break;
        }

        await new Promise((r) => setTimeout(r, 700));
      }
    }

    btnRoll.addEventListener("click", handleRoll);
    btnHold.addEventListener("click", handleHold);
    btnNew.addEventListener("click", initGame);

    initGame();
  </script>
</body>
</html>
