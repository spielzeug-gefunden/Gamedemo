<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b3d2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Punktestand</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --felt: #0b3d2e;
      --felt-deep: #072820;
      --felt-light: #145c45;
      --paper: #f3efe6;
      --ink: #14201c;
      --ink-soft: #4a5c54;
      --line: rgba(20, 32, 28, 0.12);
      --accent: #e8a317;
      --accent-ink: #2a1d00;
      --ok: #1f8a5b;
      --ok-ink: #f4fff9;
      --danger: #c23b3b;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
      --radius: 18px;
      --header-h: 52px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: "Outfit", system-ui, sans-serif;
      color: var(--paper);
      background:
        radial-gradient(120% 80% at 50% -10%, #1a6b4f 0%, transparent 55%),
        linear-gradient(180deg, var(--felt) 0%, var(--felt-deep) 100%);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      min-height: 100dvh;
      overflow: hidden;
    }

    .viewport {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: flex;
      justify-content: center;
      transition: transform 0.35s ease;
      transform-origin: center center;
    }

    .viewport.flipped {
      transform: rotate(180deg);
    }

    .app {
      width: min(100%, 480px);
      height: 100dvh;
      max-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding:
        calc(12px + var(--safe-top))
        14px
        calc(12px + var(--safe-bottom));
      gap: 12px;
    }

    .viewport.flipped .app {
      padding:
        calc(12px + var(--safe-bottom))
        14px
        calc(12px + var(--safe-top));
    }

    .screen { display: none; flex: 1; min-height: 0; flex-direction: column; gap: 12px; }
    .screen.active { display: flex; }

    /* Setup */
    .setup-card {
      margin: auto 0;
      background: rgba(243, 239, 230, 0.96);
      color: var(--ink);
      border-radius: 28px;
      padding: 28px 22px 22px;
      box-shadow: var(--shadow);
    }

    .brand {
      font-size: 0.85rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin: 0 0 8px;
      font-weight: 600;
    }

    .setup-card h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      line-height: 1.1;
    }

    .setup-card p {
      margin: 0 0 24px;
      color: var(--ink-soft);
      line-height: 1.4;
    }

    .field { margin-bottom: 14px; }

    .field label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--ink-soft);
    }

    .field input {
      width: 100%;
      border: 2px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      font: inherit;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--ink);
      background: #fffdf8;
      outline: none;
    }

    .field input:focus { border-color: var(--felt-light); }

    .btn-primary {
      width: 100%;
      margin-top: 8px;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font: inherit;
      font-size: 1.1rem;
      font-weight: 700;
      background: var(--felt);
      color: var(--paper);
      cursor: pointer;
    }

    .btn-primary:active { transform: translateY(1px); }

    /* Header */
    .topbar {
      height: var(--header-h);
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 0 4px 0 8px;
    }

    .top-status {
      min-width: 0;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      opacity: 0.9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-status.muted { opacity: 0.65; font-weight: 500; }

    .menu-wrap { position: relative; }

    .menu-btn {
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--paper);
      font: inherit;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
    }

    .menu {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      min-width: 210px;
      background: var(--paper);
      color: var(--ink);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
      z-index: 20;
    }

    .menu.open { display: block; }

    .menu button {
      width: 100%;
      border: 0;
      background: transparent;
      text-align: left;
      padding: 14px 16px;
      font: inherit;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
    }

    .menu button:active { background: rgba(11, 61, 46, 0.08); }
    .menu button.danger { color: var(--danger); }

    .menu button .check {
      float: right;
      color: var(--felt);
      font-weight: 700;
      opacity: 0;
    }

    .menu button[aria-checked="true"] .check { opacity: 1; }

    /* Main play layout */
    .play-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .table-panel,
    .keypad-panel {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .table-panel {
      background: rgba(243, 239, 230, 0.97);
      color: var(--ink);
    }

    .table-scroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }

    table.scores {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }

    .scores th,
    .scores td {
      padding: 12px 10px;
      text-align: center;
      border-bottom: 1px solid var(--line);
    }

    .scores th {
      position: sticky;
      top: 0;
      background: #ebe5d8;
      font-size: 0.92rem;
      font-weight: 700;
      z-index: 1;
    }

    .scores th.player-name {
      transition: background 0.2s ease, box-shadow 0.2s ease, color 0.2s ease;
    }

    .scores th.player-name.active {
      background: rgba(232, 163, 23, 0.38);
      color: var(--accent-ink);
      box-shadow: inset 0 -3px 0 var(--accent);
    }

    .scores th.round,
    .scores td.round {
      width: 3.2rem;
      color: var(--ink-soft);
      font-weight: 600;
      font-size: 0.85rem;
    }

    .scores td.score-cell {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 600;
      font-size: 1.05rem;
      cursor: pointer;
    }

    .scores td.score-cell:active { background: rgba(11, 61, 46, 0.08); }

    .scores td.score-cell.empty {
      color: rgba(20, 32, 28, 0.28);
      font-weight: 500;
    }

    .scores td.score-cell.editing {
      background: rgba(232, 163, 23, 0.28);
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .scores tfoot td {
      position: sticky;
      bottom: 0;
      background: #ebe5d8;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 700;
      font-size: 1.15rem;
      border-bottom: 0;
      border-top: 2px solid rgba(20, 32, 28, 0.16);
    }

    .hint {
      flex: 0 0 auto;
      padding: 8px 12px 10px;
      font-size: 0.8rem;
      color: var(--ink-soft);
      text-align: center;
      background: #ebe5d8;
    }

    .keypad-panel {
      background: rgba(7, 40, 32, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px;
      gap: 10px;
    }

    .entry {
      flex: 0 0 auto;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 6px 2px;
    }

    .entry-label {
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.75;
    }

    .entry-value {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: clamp(1.8rem, 8vw, 2.4rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      min-height: 1.2em;
    }

    .entry-value.placeholder { opacity: 0.35; }

    .keys {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 8px;
    }

    .keys button {
      border: 0;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--paper);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 1.45rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 0;
    }

    .keys button:active { background: rgba(255, 255, 255, 0.2); transform: scale(0.98); }

    .keys .key-ok {
      background: var(--ok);
      color: var(--ok-ink);
      font-family: "Outfit", system-ui, sans-serif;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .keys .key-del {
      background: rgba(255, 255, 255, 0.06);
      font-size: 1.2rem;
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: calc(18px + var(--safe-bottom));
      transform: translateX(-50%) translateY(120%);
      background: var(--paper);
      color: var(--ink);
      padding: 12px 16px;
      border-radius: 999px;
      font-weight: 600;
      box-shadow: var(--shadow);
      transition: transform 0.25s ease;
      z-index: 50;
      max-width: calc(100% - 32px);
      text-align: center;
      pointer-events: none;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }

    .viewport.flipped .toast {
      bottom: calc(18px + var(--safe-top));
    }

    .overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 30;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .overlay.open { display: flex; }

    .dialog {
      width: min(100%, 360px);
      background: var(--paper);
      color: var(--ink);
      border-radius: 22px;
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .dialog h2 {
      margin: 0 0 8px;
      font-size: 1.25rem;
    }

    .dialog p {
      margin: 0 0 18px;
      color: var(--ink-soft);
      line-height: 1.4;
    }

    .dialog-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .dialog-actions button {
      border: 0;
      border-radius: 14px;
      padding: 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-ghost {
      background: rgba(20, 32, 28, 0.08);
      color: var(--ink);
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }
  </style>
</head>
<body>
  <div class="viewport" id="viewport">
    <div class="app">
      <!-- Setup -->
      <section class="screen" id="screen-setup" aria-label="Neues Spiel">
        <div class="setup-card">
          <p class="brand">Punktestand</p>
          <h1>Neues Spiel</h1>
          <p>Namen eingeben – die Session bleibt auf diesem Gerät gespeichert.</p>
          <form id="setup-form">
            <div class="field">
              <label for="name-0">Spieler 1</label>
              <input id="name-0" name="name0" maxlength="24" autocomplete="nickname" required />
            </div>
            <div class="field">
              <label for="name-1">Spieler 2</label>
              <input id="name-1" name="name1" maxlength="24" autocomplete="nickname" required />
            </div>
            <button class="btn-primary" type="submit">Spiel starten</button>
          </form>
        </div>
      </section>

      <!-- Play -->
      <section class="screen" id="screen-play" aria-label="Punktestand">
        <header class="topbar">
          <div class="top-status muted" id="top-status">Punktestand</div>
          <div class="menu-wrap">
            <button class="menu-btn" id="menu-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Menü">⋯</button>
            <div class="menu" id="menu" role="menu">
              <button type="button" role="menuitemcheckbox" id="menu-flip" aria-checked="false">
                Ansicht drehen <span class="check" aria-hidden="true">✓</span>
              </button>
              <button type="button" role="menuitem" id="menu-undo">Letzten Eintrag löschen</button>
              <button type="button" role="menuitem" id="menu-cancel-edit" hidden>Bearbeiten abbrechen</button>
              <button type="button" role="menuitem" class="danger" id="menu-new">Neues Spiel…</button>
            </div>
          </div>
        </header>

        <div class="play-body">
          <section class="table-panel" aria-label="Punktetabelle">
            <div class="table-scroll">
              <table class="scores" id="score-table">
                <thead></thead>
                <tbody></tbody>
                <tfoot></tfoot>
              </table>
            </div>
            <div class="hint" id="table-hint">Tippe auf einen Wert, um ihn zu korrigieren.</div>
          </section>

          <section class="keypad-panel" aria-label="Zifferneingabe">
            <div class="entry">
              <span class="entry-label" id="entry-label">Rundenpunkte</span>
              <span class="entry-value placeholder" id="entry-value">0</span>
            </div>
            <div class="keys" id="keys">
              <button type="button" data-key="7">7</button>
              <button type="button" data-key="8">8</button>
              <button type="button" data-key="9">9</button>
              <button type="button" data-key="4">4</button>
              <button type="button" data-key="5">5</button>
              <button type="button" data-key="6">6</button>
              <button type="button" data-key="1">1</button>
              <button type="button" data-key="2">2</button>
              <button type="button" data-key="3">3</button>
              <button type="button" class="key-del" data-key="del" aria-label="Löschen">⌫</button>
              <button type="button" data-key="0">0</button>
              <button type="button" class="key-ok" data-key="ok">OK</button>
            </div>
          </section>
        </div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="overlay" id="confirm-overlay" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <div class="dialog">
        <h2 id="confirm-title">Neues Spiel?</h2>
        <p>Die aktuelle Session auf diesem Gerät wird gelöscht.</p>
        <div class="dialog-actions">
          <button type="button" class="btn-ghost" id="confirm-cancel">Abbrechen</button>
          <button type="button" class="btn-danger" id="confirm-ok">Löschen</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const COOKIE_NAME = "punktestand_session";
    const COOKIE_DAYS = 30;
    const PLAYER_COUNT = 2;

    /** @typedef {{ names: string[], scores: number[][], active: number, input: string, edit: null | { player: number, round: number }, flipView: boolean }} Session */

    const els = {
      viewport: document.getElementById("viewport"),
      setup: document.getElementById("screen-setup"),
      play: document.getElementById("screen-play"),
      form: document.getElementById("setup-form"),
      name0: document.getElementById("name-0"),
      name1: document.getElementById("name-1"),
      topStatus: document.getElementById("top-status"),
      menuBtn: document.getElementById("menu-btn"),
      menu: document.getElementById("menu"),
      menuFlip: document.getElementById("menu-flip"),
      menuUndo: document.getElementById("menu-undo"),
      menuCancelEdit: document.getElementById("menu-cancel-edit"),
      menuNew: document.getElementById("menu-new"),
      table: document.getElementById("score-table"),
      thead: document.querySelector("#score-table thead"),
      tbody: document.querySelector("#score-table tbody"),
      tfoot: document.querySelector("#score-table tfoot"),
      hint: document.getElementById("table-hint"),
      entryLabel: document.getElementById("entry-label"),
      entryValue: document.getElementById("entry-value"),
      keys: document.getElementById("keys"),
      toast: document.getElementById("toast"),
      overlay: document.getElementById("confirm-overlay"),
      confirmCancel: document.getElementById("confirm-cancel"),
      confirmOk: document.getElementById("confirm-ok"),
    };

    /** @type {Session | null} */
    let session = null;
    let toastTimer = 0;

    function setCookie(name, value, days) {
      const maxAge = days * 24 * 60 * 60;
      document.cookie = `${encodeURIComponent(name)}=${encodeURIComponent(value)}; Max-Age=${maxAge}; Path=/; SameSite=Lax`;
    }

    function getCookie(name) {
      const key = encodeURIComponent(name) + "=";
      const parts = document.cookie.split("; ");
      for (const part of parts) {
        if (part.startsWith(key)) {
          return decodeURIComponent(part.slice(key.length));
        }
      }
      return null;
    }

    function deleteCookie(name) {
      document.cookie = `${encodeURIComponent(name)}=; Max-Age=0; Path=/; SameSite=Lax`;
    }

    function saveSession() {
      if (!session) {
        deleteCookie(COOKIE_NAME);
        return;
      }
      const payload = {
        names: session.names,
        scores: session.scores,
        active: session.active,
        flipView: Boolean(session.flipView),
      };
      setCookie(COOKIE_NAME, JSON.stringify(payload), COOKIE_DAYS);
    }

    function loadSession() {
      const raw = getCookie(COOKIE_NAME);
      if (!raw) return null;
      try {
        const data = JSON.parse(raw);
        if (
          !Array.isArray(data.names) ||
          data.names.length !== PLAYER_COUNT ||
          !Array.isArray(data.scores) ||
          data.scores.length !== PLAYER_COUNT
        ) {
          return null;
        }
        return {
          names: data.names.map(String),
          scores: data.scores.map((list) => (Array.isArray(list) ? list.map(Number) : [])),
          active: Number.isInteger(data.active) ? data.active : 0,
          input: "",
          edit: null,
          flipView: Boolean(data.flipView),
        };
      } catch {
        return null;
      }
    }

    function facingPlayer() {
      if (!session) return 0;
      if (session.edit) return session.edit.player;
      return session.active;
    }

    function applyViewportFlip() {
      const shouldFlip = Boolean(session && session.flipView && facingPlayer() === 1);
      els.viewport.classList.toggle("flipped", shouldFlip);
      if (els.menuFlip) {
        els.menuFlip.setAttribute("aria-checked", session && session.flipView ? "true" : "false");
      }
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => els.toast.classList.remove("show"), 2200);
    }

    function showScreen(name) {
      els.setup.classList.toggle("active", name === "setup");
      els.play.classList.toggle("active", name === "play");
    }

    function closeMenu() {
      els.menu.classList.remove("open");
      els.menuBtn.setAttribute("aria-expanded", "false");
    }

    function totals() {
      return session.scores.map((list) => list.reduce((a, b) => a + b, 0));
    }

    function maxRounds() {
      return Math.max(0, ...session.scores.map((list) => list.length));
    }

    function renderTable() {
      const n = maxRounds();
      const highlight = facingPlayer();

      els.thead.innerHTML = `<tr>
        <th class="round">Rd.</th>
        ${session.names
          .map(
            (name, i) =>
              `<th class="player-name${i === highlight ? " active" : ""}">${escapeHtml(name)}</th>`
          )
          .join("")}
      </tr>`;

      if (n === 0) {
        els.tbody.innerHTML = `<tr>
          <td class="round">–</td>
          ${session.names.map(() => `<td class="score-cell empty">–</td>`).join("")}
        </tr>`;
      } else {
        const rows = [];
        for (let r = 0; r < n; r++) {
          const cells = session.scores.map((list, p) => {
            const has = r < list.length;
            const value = has ? String(list[r]) : "–";
            const editing =
              session.edit && session.edit.player === p && session.edit.round === r;
            const classes = ["score-cell", has ? "" : "empty", editing ? "editing" : ""]
              .filter(Boolean)
              .join(" ");
            return `<td class="${classes}" data-player="${p}" data-round="${r}">${value}</td>`;
          });
          rows.push(`<tr><td class="round">${r + 1}</td>${cells.join("")}</tr>`);
        }
        els.tbody.innerHTML = rows.join("");
      }

      const sums = totals();
      els.tfoot.innerHTML = `<tr>
        <td class="round">Σ</td>
        ${sums.map((sum) => `<td>${sum}</td>`).join("")}
      </tr>`;

      // Auto-scroll zur neuesten Runde
      const scroll = els.table.closest(".table-scroll");
      if (scroll) scroll.scrollTop = scroll.scrollHeight;
    }

    function renderEntry() {
      const editing = Boolean(session.edit);
      if (editing) {
        const { round } = session.edit;
        els.topStatus.textContent = `Korrektur · Runde ${round + 1}`;
        els.topStatus.classList.remove("muted");
        els.entryLabel.textContent = "Korrektur";
        els.hint.textContent = "Wert ändern und OK tippen – oder im Menü abbrechen.";
      } else {
        els.topStatus.textContent = "Punktestand";
        els.topStatus.classList.add("muted");
        els.entryLabel.textContent = "Rundenpunkte";
        els.hint.textContent = "Tippe auf einen Wert, um ihn zu korrigieren.";
      }

      const raw = session.input;
      els.entryValue.textContent = raw === "" ? "0" : raw;
      els.entryValue.classList.toggle("placeholder", raw === "");

      els.menuCancelEdit.hidden = !editing;
      els.menuUndo.hidden = editing;
      applyViewportFlip();
    }

    function renderAll() {
      renderTable();
      renderEntry();
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function startNewSession(names) {
      session = {
        names: names.map((n) => n.trim()),
        scores: Array.from({ length: PLAYER_COUNT }, () => []),
        active: 0,
        input: "",
        edit: null,
        flipView: false,
      };
      saveSession();
      showScreen("play");
      renderAll();
    }

    function resumeOrSetup() {
      session = loadSession();
      if (session) {
        showScreen("play");
        renderAll();
      } else {
        showScreen("setup");
        els.viewport.classList.remove("flipped");
        if (els.menuFlip) els.menuFlip.setAttribute("aria-checked", "false");
        els.name0.focus();
      }
    }

    function toggleFlipView() {
      if (!session) return;
      session.flipView = !session.flipView;
      saveSession();
      applyViewportFlip();
      closeMenu();
      showToast(
        session.flipView
          ? "Ansicht drehen an – bei Spieler 2 um 180°"
          : "Ansicht drehen aus"
      );
    }

    function appendDigit(digit) {
      if (session.input.length >= 6) return;
      if (session.input === "0") {
        session.input = digit;
      } else {
        session.input += digit;
      }
      renderEntry();
    }

    function deleteDigit() {
      session.input = session.input.slice(0, -1);
      renderEntry();
    }

    function commitOk() {
      if (session.input === "") {
        showToast("Bitte Punkte eingeben");
        return;
      }
      const value = Number(session.input);
      if (!Number.isFinite(value) || value < 0) {
        showToast("Ungültige Zahl");
        return;
      }

      if (session.edit) {
        const { player, round } = session.edit;
        if (round >= session.scores[player].length) return;
        session.scores[player][round] = value;
        session.edit = null;
        session.input = "";
        saveSession();
        renderAll();
        showToast("Eintrag korrigiert");
        return;
      }

      session.scores[session.active].push(value);
      session.active = (session.active + 1) % PLAYER_COUNT;
      session.input = "";
      saveSession();
      renderAll();
    }

    function beginEdit(player, round) {
      if (round >= session.scores[player].length) return;
      session.edit = { player, round };
      session.input = String(session.scores[player][round]);
      closeMenu();
      renderAll();
    }

    function cancelEdit() {
      session.edit = null;
      session.input = "";
      closeMenu();
      renderAll();
    }

    function undoLast() {
      closeMenu();
      if (session.edit) return;

      // Letzten Eintrag des vorherigen Spielers entfernen und zu ihm zurück
      const prev = (session.active - 1 + PLAYER_COUNT) % PLAYER_COUNT;
      if (session.scores[prev].length === 0) {
        // vielleicht hat aktiver Spieler schon Einträge und wir sind am Anfang?
        // Suche den Spieler mit dem chronologisch letzten Eintrag:
        // Da Spieler strikt abwechseln, ist der letzte Eintrag immer beim prev,
        // außer niemand hat noch Punkte.
        const any = session.scores.some((list) => list.length > 0);
        if (!any) {
          showToast("Nichts zum Löschen");
          return;
        }
      }

      if (session.scores[prev].length === 0) {
        showToast("Nichts zum Löschen");
        return;
      }

      session.scores[prev].pop();
      session.active = prev;
      session.input = "";
      saveSession();
      renderAll();
      showToast("Letzter Eintrag gelöscht");
    }

    function resetToSetup() {
      session = null;
      saveSession();
      els.form.reset();
      showScreen("setup");
      els.viewport.classList.remove("flipped");
      if (els.menuFlip) els.menuFlip.setAttribute("aria-checked", "false");
      els.overlay.classList.remove("open");
      closeMenu();
      els.name0.focus();
    }

    // Events
    els.form.addEventListener("submit", (event) => {
      event.preventDefault();
      const names = [els.name0.value, els.name1.value];
      if (names.some((n) => !n.trim())) {
        showToast("Bitte beide Namen eingeben");
        return;
      }
      if (names[0].trim().toLowerCase() === names[1].trim().toLowerCase()) {
        showToast("Bitte unterschiedliche Namen");
        return;
      }
      startNewSession(names);
    });

    els.keys.addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-key]");
      if (!btn || !session) return;
      const key = btn.dataset.key;
      if (key === "ok") commitOk();
      else if (key === "del") deleteDigit();
      else appendDigit(key);
    });

    els.tbody.addEventListener("click", (event) => {
      const cell = event.target.closest("td.score-cell[data-player]");
      if (!cell || !session) return;
      const player = Number(cell.dataset.player);
      const round = Number(cell.dataset.round);
      if (round >= session.scores[player].length) return;
      beginEdit(player, round);
    });

    els.menuBtn.addEventListener("click", (event) => {
      event.stopPropagation();
      const open = !els.menu.classList.contains("open");
      els.menu.classList.toggle("open", open);
      els.menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
    });

    document.addEventListener("click", (event) => {
      if (!els.menu.contains(event.target) && event.target !== els.menuBtn) {
        closeMenu();
      }
    });

    els.menuFlip.addEventListener("click", toggleFlipView);
    els.menuUndo.addEventListener("click", undoLast);
    els.menuCancelEdit.addEventListener("click", cancelEdit);
    els.menuNew.addEventListener("click", () => {
      closeMenu();
      els.overlay.classList.add("open");
    });
    els.confirmCancel.addEventListener("click", () => els.overlay.classList.remove("open"));
    els.confirmOk.addEventListener("click", resetToSetup);

    resumeOrSetup();
  </script>
</body>
</html>
